name: DOM-V2 Main Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate file structure
      run: |
        echo "Validating project structure..."
        test -f "package.json" || exit 1
        test -f "frontend/package.json" || exit 1
        test -d "frontend/src/micro-frontends/shared" || exit 1
        echo "✅ Project structure is valid"
        
    - name: Check for required files
      run: |
        echo "Checking for required files..."
        test -f "README.md" || exit 1
        test -f "docs/README.md" || exit 1
        test -f "frontend/src/micro-frontends/shared/package.json" || exit 1
        echo "✅ All required files present"
        
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm ci
        cd frontend && npm ci
        
    - name: Run security audit
      run: |
        npm audit --audit-level moderate
        cd frontend && npm audit --audit-level moderate
        
    - name: Run dependency check
      run: |
        node scripts/auditar-deps-final.js
        
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [validate, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run quality checks
      run: |
        cd frontend
        npm run lint
        npm test -- --coverage --watchAll=false
        
    - name: Check test coverage
      run: |
        cd frontend
        npm run test:coverage
        # Fail if coverage is below 80%
        if [ $(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)") -lt 80 ]; then
          echo "❌ Test coverage is below 80%"
          exit 1
        fi
        echo "✅ Test coverage is above 80%"
