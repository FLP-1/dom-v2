name: Web Pipeline - DOM-V2

on:
  push:
    branches: [ main, develop, 'feature/web-*' ]
    paths: [ 'frontend/**', 'docs/**', 'scripts/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'frontend/**', 'docs/**', 'scripts/**' ]

jobs:
  test:
    name: Test Web Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        cd ..
        npm ci
        
    - name: Validate directives (root)
      run: |
        npm run validate-directives

    - name: Run linting (frontend)
      run: |
        cd frontend
        npm run lint
        
    - name: Typecheck (frontend)
      run: |
        cd frontend
        npm run typecheck

    - name: Run tests (frontend)
      run: |
        cd frontend
        npm test
        
    - name: Build application (frontend)
      run: |
        cd frontend
        npm run build

    - name: Backend - Install deps
      run: |
        cd backend
        npm ci

    - name: Backend - Build
      run: |
        cd backend
        npm run build

    - name: Backend - Tests
      run: |
        cd backend
        npm run test:ci
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: frontend/dist/
        retention-days: 7
        
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-build
        
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-build
        
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
