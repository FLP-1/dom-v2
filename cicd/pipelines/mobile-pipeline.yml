name: Mobile Pipeline - DOM-V2

on:
  push:
    branches: [ main, develop, 'feature/mobile-*' ]
    paths: [ 'frontend/**', 'mobile-app/**', 'docs/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'frontend/**', 'mobile-app/**', 'docs/**' ]

jobs:
  test:
    name: Test Mobile Application
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run linting
      run: |
        cd frontend
        npm run lint
        
    - name: Run tests
      run: |
        cd frontend
        npm test
        
    - name: Metro bundler test
      run: |
        cd frontend
        npx react-native start --reset-cache &
        sleep 10
        npx react-native run-android --variant=debug
        
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build Android APK
      run: |
        cd frontend
        npx react-native run-android --variant=release
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: frontend/android/app/build/outputs/apk/release/
        retention-days: 30
        
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Install iOS dependencies
      run: |
        cd frontend/ios
        pod install
        
    - name: Build iOS app
      run: |
        cd frontend
        npx react-native run-ios --configuration Release
        
    - name: Upload iOS build
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: frontend/ios/build/
        retention-days: 30
