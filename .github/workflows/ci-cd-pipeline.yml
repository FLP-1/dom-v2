name: CI/CD Pipeline - DOM v2

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  # Job de Validação Básica
  validate:
    name: 🔍 Validação Básica
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 Validate project structure
      run: |
        echo "🔍 Validando estrutura do projeto..."
        
        # Verificar arquivos essenciais
        if [ -f "README.md" ]; then
          echo "✅ README.md encontrado"
        else
          echo "❌ README.md não encontrado"
          exit 1
        fi
        
        if [ -f "LICENSE" ]; then
          echo "✅ LICENSE encontrado"
        else
          echo "❌ LICENSE não encontrado"
          exit 1
        fi
        
        if [ -f ".gitignore" ]; then
          echo "✅ .gitignore encontrado"
        else
          echo "❌ .gitignore não encontrado"
          exit 1
        fi
        
        # Verificar diretórios essenciais
        if [ -d "frontend" ]; then
          echo "✅ Diretório frontend encontrado"
        else
          echo "❌ Diretório frontend não encontrado"
          exit 1
        fi
        
        if [ -d "backend" ]; then
          echo "✅ Diretório backend encontrado"
        else
          echo "❌ Diretório backend não encontrado"
          exit 1
        fi
        
        if [ -d "docs" ]; then
          echo "✅ Diretório docs encontrado"
        else
          echo "❌ Diretório docs não encontrado"
          exit 1
        fi
        
        if [ -d "scripts" ]; then
          echo "✅ Diretório scripts encontrado"
        else
          echo "❌ Diretório scripts não encontrado"
          exit 1
        fi
        
        # Verificar package.json
        if [ -f "frontend/package.json" ]; then
          echo "✅ frontend/package.json encontrado"
        else
          echo "❌ frontend/package.json não encontrado"
          exit 1
        fi
        
        if [ -f "backend/package.json" ]; then
          echo "✅ backend/package.json encontrado"
        else
          echo "❌ backend/package.json não encontrado"
          exit 1
        fi
        
        echo "✅ Estrutura do projeto validada com sucesso!"
        echo "🎯 DOM v2 está pronto!"

  # Job de Status Final
  status:
    name: ✅ Status Final
    runs-on: ubuntu-latest
    needs: [validate]
    if: always()
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: ✅ Generate status report
      run: |
        echo "## 🎉 DOM v2 CI/CD Pipeline Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Jobs Concluídos:" >> $GITHUB_STEP_SUMMARY
        echo "- **Validação:** ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Resumo:" >> $GITHUB_STEP_SUMMARY
        if [ "${{ needs.validate.result }}" == "success" ]; then
          echo "🎯 **VALIDAÇÃO PASSOU!**" >> $GITHUB_STEP_SUMMARY
          echo "✅ Estrutura do projeto validada" >> $GITHUB_STEP_SUMMARY
          echo "✅ Arquivos essenciais encontrados" >> $GITHUB_STEP_SUMMARY
          echo "✅ Diretórios essenciais encontrados" >> $GITHUB_STEP_SUMMARY
          echo "✅ Package.json encontrados" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **VALIDAÇÃO FALHOU**" >> $GITHUB_STEP_SUMMARY
          echo "🔧 Verificar logs para detalhes" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: 📢 Notify completion
      run: |
        if [ "${{ needs.validate.result }}" == "success" ]; then
          echo "✅ Pipeline concluído com sucesso!"
        else
          echo "❌ Pipeline falhou - verificar logs"
          exit 1
        fi 