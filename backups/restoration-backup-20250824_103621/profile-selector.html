<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM - Seleção de Perfil</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <meta name="theme-color" content="#007AFF">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .profile-selector-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .logo img {
            width: 60px;
            height: 60px;
            border-radius: 12px;
        }
        
        .logo-text {
            font-size: 28px;
            font-weight: bold;
            color: #007AFF;
            margin: 0;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .user-info {
            background: #f8f9fa;
            border: 1px solid #e1e5e9;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .user-email {
            font-size: 14px;
            color: #666;
        }
        
        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .profile-card {
            background: white;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .profile-card:hover {
            border-color: #007AFF;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 122, 255, 0.15);
        }
        
        .profile-card.selected {
            border-color: #007AFF;
            background: rgba(0, 122, 255, 0.05);
        }
        
        .profile-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .profile-name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .profile-description {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }
        
        .continue-btn {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .continue-btn:hover {
            background: #0056CC;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }
        
        .continue-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .logout-link {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .logout-link a {
            color: #007AFF;
            text-decoration: none;
            font-weight: 600;
        }
        
        .logout-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .profile-selector-container {
                padding: 20px;
                margin: 20px;
            }
            
            .profiles-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="profile-selector-container">
        <div class="logo">
            <img src="Logo.png" alt="DOM Logo">
            <h1 class="logo-text">DOM</h1>
        </div>
        
        <h2 class="title">Selecione seu Perfil</h2>
        <p class="subtitle">Escolha o perfil que deseja usar no sistema</p>
        
        <div class="user-info" id="userInfo">
            <div class="user-name" id="userName">Carregando...</div>
            <div class="user-email" id="userEmail">carregando@email.com</div>
        </div>
        
        <div class="profiles-grid" id="profilesGrid">
            <!-- Perfis serão carregados dinamicamente -->
        </div>
        
        <button class="continue-btn" id="continueBtn" onclick="continueToDashboard()" disabled>
            Continuar para o Dashboard
        </button>
        
        <div class="logout-link">
            <a href="#" onclick="logout()">Usar outro usuário</a>
        </div>
    </div>

    <script>
        let selectedProfile = null;
        let userProfiles = [];
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            loadUserData();
            loadProfiles();
        });
        
        // Carregar dados do usuário
        function loadUserData() {
            const userData = localStorage.getItem('dom_v2_user');
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    document.getElementById('userName').textContent = user.name || 'Usuário';
                    document.getElementById('userEmail').textContent = user.email || 'usuario@email.com';
                } catch (e) {
                    console.error('Erro ao carregar dados do usuário:', e);
                }
            }
        }
        
        // Carregar perfis disponíveis
        function loadProfiles() {
            const userData = localStorage.getItem('dom_v2_user');
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    
                    // Perfis padrão se não houver perfis específicos
                    userProfiles = user.profiles || [
                        {
                            id: 'employer',
                            name: 'Empregador',
                            description: 'Gerencie funcionários, orçamentos e pagamentos',
                            icon: '👔',
                            route: 'dashboard.html'
                        },
                        {
                            id: 'employee',
                            name: 'Funcionário',
                            description: 'Visualize tarefas e informações pessoais',
                            icon: '👷',
                            route: 'dashboard-employee.html'
                        },
                        {
                            id: 'admin',
                            name: 'Administrador',
                            description: 'Acesso completo ao sistema',
                            icon: '⚙️',
                            route: 'dashboard-admin.html'
                        }
                    ];
                    
                    renderProfiles();
                } catch (e) {
                    console.error('Erro ao carregar perfis:', e);
                }
            }
        }
        
        // Renderizar perfis
        function renderProfiles() {
            const grid = document.getElementById('profilesGrid');
            grid.innerHTML = '';
            
            userProfiles.forEach(profile => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.onclick = () => selectProfile(profile);
                
                card.innerHTML = `
                    <div class="profile-icon">${profile.icon}</div>
                    <div class="profile-name">${profile.name}</div>
                    <div class="profile-description">${profile.description}</div>
                `;
                
                grid.appendChild(card);
            });
        }
        
        // Selecionar perfil
        function selectProfile(profile) {
            selectedProfile = profile;
            
            // Remover seleção anterior
            document.querySelectorAll('.profile-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // Adicionar seleção ao card clicado
            event.currentTarget.classList.add('selected');
            
            // Habilitar botão continuar
            document.getElementById('continueBtn').disabled = false;
        }
        
        // Continuar para dashboard
        function continueToDashboard() {
            if (selectedProfile) {
                // Salvar perfil selecionado
                localStorage.setItem('dom_v2_selected_profile', JSON.stringify(selectedProfile));
                
                // Redirecionar para a rota do perfil
                window.location.href = selectedProfile.route;
            }
        }
        
        // Logout
        function logout() {
            // Limpar dados de sessão
            localStorage.removeItem('dom_v2_user');
            localStorage.removeItem('dom_v2_token');
            localStorage.removeItem('dom_v2_login_time');
            localStorage.removeItem('dom_v2_selected_profile');
            
            // Redirecionar para login
            window.location.href = 'login-screen.html';
        }
    </script>
</body>
</html>
