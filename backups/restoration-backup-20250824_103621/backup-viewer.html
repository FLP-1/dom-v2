<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Backups - DOM v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .header p {
            font-size: 1.1em;
            color: #666;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 300px;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
        
        .btn.secondary {
            background: #6c757d;
        }
        
        .btn.secondary:hover {
            background: #5a6268;
        }
        
        .btn.success {
            background: #28a745;
        }
        
        .btn.success:hover {
            background: #218838;
        }
        
        .backup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .backup-card {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            background: #f8f9fa;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .backup-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .backup-card.selected {
            border-color: #28a745;
            background: #e7f7ed;
        }
        
        .backup-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .backup-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #666;
        }
        
        .backup-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn-small {
            padding: 8px 15px;
            font-size: 0.85em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-view {
            background: #17a2b8;
            color: white;
        }
        
        .btn-view:hover {
            background: #138496;
        }
        
        .btn-restore {
            background: #28a745;
            color: white;
        }
        
        .btn-restore:hover {
            background: #218838;
        }
        
        .btn-code {
            background: #ffc107;
            color: #212529;
        }
        
        .btn-code:hover {
            background: #e0a800;
        }
        
        .viewer-area {
            margin-top: 30px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            background: white;
            min-height: 400px;
        }
        
        .viewer-header {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .viewer-content {
            padding: 20px;
            min-height: 350px;
        }
        
        .viewer-iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 5px;
        }
        
        .code-container {
            background: #2d3748;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #e9ecef;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .success {
            color: #155724;
            background: #d4edda;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .backup-type {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .backup-type.original {
            background: #28a745;
            color: white;
        }
        
        .backup-type.advanced {
            background: #17a2b8;
            color: white;
        }
        
        .backup-type.final {
            background: #6f42c1;
            color: white;
        }
        
        .backup-type.css-prefix {
            background: #fd7e14;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💾 Visualizador de Backups</h1>
            <p>DOM v2 - Versões Originais das Telas</p>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalBackups">...</div>
                <div class="stat-label">Total de Backups</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="originalBackups">...</div>
                <div class="stat-label">Backups Originais</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="advancedBackups">...</div>
                <div class="stat-label">Backups Avançados</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="finalBackups">...</div>
                <div class="stat-label">Backups Finais</div>
            </div>
        </div>
        
        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Buscar backups por nome...">
            <button class="btn" onclick="refreshBackups()">🔄 Atualizar</button>
            <button class="btn secondary" onclick="clearViewer()">🗑️ Limpar</button>
            <button class="btn success" onclick="restoreSelected()">🔄 Restaurar Selecionado</button>
        </div>
        
        <div class="backup-grid" id="backupGrid">
            <div class="loading">Carregando backups...</div>
        </div>
        
        <div class="viewer-area hidden" id="viewerArea">
            <div class="viewer-header">
                <h3 id="viewerTitle">Nenhum backup selecionado</h3>
                <div>
                    <button class="btn-small btn-view" onclick="openInNewTab()">🔗 Nova Aba</button>
                    <button class="btn-small btn-code" onclick="toggleCodeView()">📝 Código</button>
                    <button class="btn-small" onclick="closeViewer()" style="background: #dc3545; color: white;">✖ Fechar</button>
                </div>
            </div>
            <div class="viewer-content" id="viewerContent">
                <!-- Conteúdo do backup será carregado aqui -->
            </div>
        </div>
    </div>

    <script>
        // Lista de backups conhecidos
        const backupFiles = [
            // Backups originais (mais antigos)
            'app.html.backup',
            'splash.html.backup',
            'login-screen.html.backup',
            'dashboard.html.backup',
            'index.html.backup',
            'index-working.html.backup',
            'simple-app.html.backup',
            'simple-web.html.backup',
            
            // Backups avançados
            'app.html.advanced-backup',
            'splash.html.advanced-backup',
            'login-screen.html.advanced-backup',
            'dashboard.html.advanced-backup',
            'index.html.advanced-backup',
            'index-working.html.advanced-backup',
            'simple-app.html.advanced-backup',
            'simple-web.html.advanced-backup',
            
            // Backups finais (mais recentes)
            'app.html.final-backup-2025-08-22T16-21-34-620Z',
            'splash.html.final-backup-2025-08-22T16-21-34-961Z',
            'login-screen.html.final-backup-2025-08-22T16-21-34-803Z',
            'dashboard.html.final-backup-2025-08-22T16-21-34-705Z',
            'index.html.final-backup-2025-08-22T16-21-34-790Z',
            'index-working.html.final-backup-2025-08-22T16-21-34-786Z',
            'simple-app.html.final-backup-2025-08-22T16-21-34-948Z',
            'simple-web.html.final-backup-2025-08-22T16-21-34-953Z',
            
            // Backups CSS prefix
            'app.html.css-prefix-backup-2025-08-22T16-23-04-445Z',
            'splash.html.css-prefix-backup-2025-08-22T16-23-04-883Z',
            'login-screen.html.css-prefix-backup-2025-08-22T16-23-04-658Z',
            'dashboard.html.css-prefix-backup-2025-08-22T16-23-04-562Z',
            'index.html.css-prefix-backup-2025-08-22T16-23-04-647Z',
            'index-working.html.css-prefix-backup-2025-08-22T16-23-04-638Z',
            'simple-app.html.css-prefix-backup-2025-08-22T16-23-04-865Z',
            'simple-web.html.css-prefix-backup-2025-08-22T16-23-04-868Z'
        ];

        let backups = [];
        let currentBackup = null;
        let codeViewActive = false;

        // Inicializar aplicação
        async function init() {
            await loadBackups();
            setupEventListeners();
            updateStats();
        }

        // Carregar informações dos backups
        async function loadBackups() {
            backups = [];
            
            for (const backupName of backupFiles) {
                try {
                    const response = await fetch(backupName, { method: 'HEAD' });
                    if (response.ok) {
                        const backup = {
                            name: backupName,
                            title: getBackupTitle(backupName),
                            type: getBackupType(backupName),
                            size: response.headers.get('content-length') || 'N/A',
                            lastModified: response.headers.get('last-modified') || 'N/A',
                            accessible: true,
                            originalName: getOriginalName(backupName)
                        };
                        backups.push(backup);
                    }
                } catch (error) {
                    console.log(`Backup não encontrado: ${backupName}`);
                }
            }
            
            renderBackups();
        }

        // Obter título do backup
        function getBackupTitle(name) {
            const originalName = getOriginalName(name);
            const type = getBackupType(name);
            return `${originalName} (${type})`;
        }

        // Obter nome original do arquivo
        function getOriginalName(backupName) {
            return backupName.replace(/\.(backup|advanced-backup|final-backup.*|css-prefix-backup.*)$/, '');
        }

        // Obter tipo do backup
        function getBackupType(name) {
            if (name.includes('final-backup')) return 'Final';
            if (name.includes('advanced-backup')) return 'Avançado';
            if (name.includes('css-prefix-backup')) return 'CSS Prefix';
            if (name.includes('backup')) return 'Original';
            return 'Desconhecido';
        }

        // Renderizar lista de backups
        function renderBackups(filteredBackups = null) {
            const grid = document.getElementById('backupGrid');
            const backupsToRender = filteredBackups || backups;
            
            if (backupsToRender.length === 0) {
                grid.innerHTML = '<div class="loading">Nenhum backup encontrado</div>';
                return;
            }

            grid.innerHTML = backupsToRender.map(backup => `
                <div class="backup-card" onclick="selectBackup('${backup.name}')" data-backup="${backup.name}">
                    <div class="backup-title">
                        ${backup.title}
                        <span class="backup-type ${backup.type.toLowerCase().replace(' ', '-')}">${backup.type}</span>
                    </div>
                    <div class="backup-info">
                        <div><strong>Arquivo:</strong> ${backup.originalName}</div>
                        <div><strong>Tipo:</strong> ${backup.type}</div>
                        <div><strong>Tamanho:</strong> ${formatSize(backup.size)}</div>
                        <div><strong>Status:</strong> ${backup.accessible ? '✅ OK' : '❌ Erro'}</div>
                    </div>
                    <div class="backup-actions">
                        <button class="btn-small btn-view" onclick="event.stopPropagation(); viewBackup('${backup.name}')">👁️ Ver</button>
                        <button class="btn-small btn-restore" onclick="event.stopPropagation(); restoreBackup('${backup.name}')">🔄 Restaurar</button>
                        <button class="btn-small btn-code" onclick="event.stopPropagation(); viewCode('${backup.name}')">📝 Código</button>
                    </div>
                </div>
            `).join('');
        }

        // Formatar tamanho do arquivo
        function formatSize(bytes) {
            if (bytes === 'N/A') return 'N/A';
            const size = parseInt(bytes);
            if (isNaN(size)) return 'N/A';
            if (size < 1024) return size + ' B';
            if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB';
            return (size / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Selecionar backup
        function selectBackup(backupName) {
            document.querySelectorAll('.backup-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            const card = document.querySelector(`[data-backup="${backupName}"]`);
            if (card) {
                card.classList.add('selected');
            }
            
            currentBackup = backupName;
        }

        // Visualizar backup
        function viewBackup(backupName) {
            selectBackup(backupName);
            showViewer(backupName, 'iframe');
        }

        // Restaurar backup
        async function restoreBackup(backupName) {
            const originalName = getOriginalName(backupName);
            const confirmRestore = confirm(`Deseja restaurar ${backupName} para ${originalName}?`);
            
            if (confirmRestore) {
                try {
                    const response = await fetch(backupName);
                    const content = await response.text();
                    
                    // Aqui você pode implementar a lógica de restauração
                    // Por enquanto, vamos apenas mostrar o conteúdo
                    showViewer(backupName, 'code');
                    
                    alert(`Backup ${backupName} carregado com sucesso!`);
                } catch (error) {
                    alert(`Erro ao restaurar backup: ${error.message}`);
                }
            }
        }

        // Restaurar backup selecionado
        function restoreSelected() {
            if (currentBackup) {
                restoreBackup(currentBackup);
            } else {
                alert('Selecione um backup para restaurar');
            }
        }

        // Visualizar código
        function viewCode(backupName) {
            selectBackup(backupName);
            showViewer(backupName, 'code');
        }

        // Mostrar visualizador
        async function showViewer(backupName, mode = 'iframe') {
            const viewer = document.getElementById('viewerArea');
            const title = document.getElementById('viewerTitle');
            const content = document.getElementById('viewerContent');
            
            title.textContent = `${getBackupTitle(backupName)} (${backupName})`;
            viewer.classList.remove('hidden');
            
            if (mode === 'iframe') {
                content.innerHTML = `<iframe src="${backupName}" class="viewer-iframe"></iframe>`;
                codeViewActive = false;
            } else if (mode === 'code') {
                try {
                    const response = await fetch(backupName);
                    const code = await response.text();
                    content.innerHTML = `
                        <div class="code-container">
                            <pre>${escapeHtml(code)}</pre>
                        </div>
                    `;
                    codeViewActive = true;
                } catch (error) {
                    content.innerHTML = `<div class="error">Erro ao carregar código: ${error.message}</div>`;
                }
            }
            
            currentBackup = backupName;
        }

        // Escapar HTML
        function escapeHtml(html) {
            const div = document.createElement('div');
            div.textContent = html;
            return div.innerHTML;
        }

        // Alternar visualização de código
        function toggleCodeView() {
            if (currentBackup) {
                showViewer(currentBackup, codeViewActive ? 'iframe' : 'code');
            }
        }

        // Abrir em nova aba
        function openInNewTab() {
            if (currentBackup) {
                window.open(currentBackup, '_blank');
            }
        }

        // Fechar visualizador
        function closeViewer() {
            document.getElementById('viewerArea').classList.add('hidden');
            currentBackup = null;
        }

        // Limpar visualizador
        function clearViewer() {
            closeViewer();
            document.querySelectorAll('.backup-card').forEach(card => {
                card.classList.remove('selected');
            });
        }

        // Atualizar backups
        function refreshBackups() {
            document.getElementById('backupGrid').innerHTML = '<div class="loading">Carregando backups...</div>';
            loadBackups();
        }

        // Configurar event listeners
        function setupEventListeners() {
            const searchBox = document.getElementById('searchBox');
            searchBox.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = backups.filter(backup => 
                    backup.name.toLowerCase().includes(query) ||
                    backup.title.toLowerCase().includes(query) ||
                    backup.type.toLowerCase().includes(query) ||
                    backup.originalName.toLowerCase().includes(query)
                );
                renderBackups(filtered);
            });
        }

        // Atualizar estatísticas
        function updateStats() {
            const total = backups.length;
            const original = backups.filter(b => b.type === 'Original').length;
            const advanced = backups.filter(b => b.type === 'Avançado').length;
            const final = backups.filter(b => b.type === 'Final').length;
            
            document.getElementById('totalBackups').textContent = total;
            document.getElementById('originalBackups').textContent = original;
            document.getElementById('advancedBackups').textContent = advanced;
            document.getElementById('finalBackups').textContent = final;
        }

        // Inicializar quando a página carregar
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
