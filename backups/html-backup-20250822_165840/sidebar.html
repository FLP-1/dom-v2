<!-- Sidebar JavaScript -->
<script>
    // Função para carregar dados do usuário logado
    function loadUserData() {
    
        const userData = localStorage.getItem('dom_v2_user');
    
        const token = localStorage.getItem('dom_v2_token');
    
        
        if (!userData || !token) {
            console.log('Usuário não logado, redirecionando para login');
    
            window.location.href = 'login-screen.html';
    
            return null;
}
        
        try {
    
            const user = JSON.parse(userData);
    
            console.log('Usuário logado:', user);
    
            return user;
} catch (error) {
    
            console.error('Erro ao carregar dados do usuário:', error);
    
            window.location.href = 'login-screen.html';
    
            return null;
}
    }

    // Função para atualizar sidebar com dados do usuário
    function updateSidebar(user) {
    
        const userAvatar = document.getElementById('userAvatar');
    
        const userName = document.getElementById('userName');
    
        const userProfile = document.getElementById('userProfile');
    
        
        if (userAvatar) {
            // Usar nickname se disponível, senão primeira letra do nome
            const displayName = user.nickname || user.name;
    
            userAvatar.textContent = displayName.charAt(0).toUpperCase();
}
        
        if (userName) {
    
            // Usar nickname se disponível, senão nome completo
            userName.textContent = user.nickname || user.name;
}
        
        if (userProfile) {
    
            const profileNames = {
                'EMPLOYER': 'Empregador',
                'EMPLOYEE': 'Funcionário',
                'FAMILY': 'Familiar',
                'ADMIN': 'Administrador',
                'user': 'Usuário'
            ;
};
            userProfile.textContent = profileNames[user.profile] || 'Usuário';
        }
    }

    // Função para alternar sidebar
    function toggleSidebar() {
    
        const sidebar = document.getElementById('sidebar');
    
        const overlay = document.getElementById('sidebarOverlay');
    
        const mainContent = document.getElementById('mainContent');
    
        
        sidebar.classList.toggle('open');
    
        overlay.classList.toggle('open');
    
        mainContent.classList.toggle('sidebar-open');
}

    // Função para fechar sidebar
    function closeSidebar() {
    
        const sidebar = document.getElementById('sidebar');
    
        const overlay = document.getElementById('sidebarOverlay');
    
        const mainContent = document.getElementById('mainContent');
    
        
        sidebar.classList.remove('open');
    
        overlay.classList.remove('open');
    
        mainContent.classList.remove('sidebar-open');
}

    // Função de logout
    function logout() {
    
        if (confirm('Tem certeza que deseja sair?')) {
            localStorage.removeItem('dom_v2_user');
    
            localStorage.removeItem('dom_v2_token');
    
            localStorage.removeItem('dom_v2_login_time');
    
            window.location.href = 'login-screen.html';
}
    }

    // Função para marcar item ativo no menu
    function setActiveNavItem() {
    
        const currentPage = window.location.pathname.split('/').pop();
    
        const navItems = document.querySelectorAll('.nav-item');
    
        
        navItems.forEach(item => {
            item.classList.remove('active');
    
            const href = item.getAttribute('href');
    
            if (href === currentPage) {
                item.classList.add('active');
}
        });
    }

    // Inicialização do sidebar
    function initSidebar() {
    
        const user = loadUserData();
    
        if (user) {
            updateSidebar(user);
    
            setActiveNavItem();
}
        
        // Fechar sidebar ao clicar no overlay
        const overlay = document.getElementById('sidebarOverlay');
        if (overlay) {
    
            overlay.addEventListener('click', closeSidebar);
}
        
        // Fechar sidebar ao pressionar ESC
        document.addEventListener('keydown', function(e) {
    
            if (e.key === 'Escape') {
                closeSidebar();
}
        });
    }

    // Executar quando o DOM estiver carregado
    document.addEventListener('DOMContentLoaded', initSidebar);
</script>
