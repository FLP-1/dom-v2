<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Aprovações - DOM v2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .approval-card {
    -webkit-transition: all 0.3s ease;
    transition: all 0.3s ease;
    border-left: 4px solid #007bff;
}
        .approval-card:hover {
    -webkit-transform: translateY(-2px);
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
        .approval-card.approved {
    border-left-color: #28a745;
}
        .approval-card.rejected {
    border-left-color: #dc3545;
}
        .approval-card.pending {
    border-left-color: #ffc107;
}
        .step-indicator {
    display: flex;
    width: 30px;
    height: 30px;
    margin: 0 5px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}
        .step-completed {
    color: white;
    background-color: #28a745;
}
        .step-current {
    color: white;
    background-color: #007bff;
}
        .step-pending {
    color: white;
    background-color: #6c757d;
}
        .priority-badge {
    font-size: 0.8em;
}
        .priority-urgent {
    background-color: #dc3545;
}
        .priority-high {
    background-color: #fd7e14;
}
        .priority-medium {
    color: #212529;
    background-color: #ffc107;
}
        .priority-low {
    background-color: #28a745;
}
        .workflow-step {
    padding: 15px;
    border: 1px solid #dee2e6;
    background-color: #f8f9fa;
    border-radius: 8px;
    margin-bottom: 10px;
}
        .analytics-card {
    padding: 20px;
    color: white;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 15px;
    margin-bottom: 20px;
}
        .history-item {
    border-left: 3px solid #007bff;
    padding-left: 15px;
    margin-bottom: 10px;
}
        .history-approve {
    border-left-color: #28a745;
}
        .history-reject {
    border-left-color: #dc3545;
}
    </style>
  <style>
    .extracted-style-1 {
    display: none;
}
    .extracted-style-2 {
    display: none;
}
    .extracted-style-3 {
    display: none;
}
    .extracted-style-4 {
    display: none;
}
    .extracted-style-5 {
    width: ${analytics.approvalRate;
}% }
  </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar" role="navigation">
                <div class="position-sticky pt-3">
                    <h5 class="px-3 mb-3">Sistema de Aprovações</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" onclick="showTab('workflows')" tabindex="0">
                                <i class="fas"aria-hidden="true"></i> Workflows
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showTab('requests')" tabindex="0">
                                <i class="fas"aria-hidden="true"></i> Solicitações
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showTab('pending')" tabindex="0">
                                <i class="fas"aria-hidden="true"></i> Pendentes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showTab('analytics')" tabindex="0">
                                <i class="fas"aria-hidden="true"></i> Analytics
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" role="main">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Sistema de Aprovações</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshData()" tabindex="0">
                                <i class="fas"aria-hidden="true"></i> Atualizar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Workflows Tab -->
                <div id="workflows-tab" class="tab-content">
                    <div class="row mb-3">
                        <div class="col">
                            <h3>Workflows de Aprovação</h3>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-primary" onclick="showCreateWorkflowModal()" tabindex="0">
                                <i class="fas"aria-hidden="true"></i> Novo Workflow
                            </button>
                        </div>
                    </div>
                    <div id="workflows-list" class="row">
                        <!-- Workflows serão carregados aqui -->
                    </div>
                </div>

                <!-- Requests Tab -->
                <div id="requests-tab" class="tab-content" class="extracted-style-1">
                    <div class="row mb-3">
                        <div class="col">
                            <h3>Solicitações de Aprovação</h3>
                        </div>
                        <div class="col-auto">
                            <button class="btn btn-primary" onclick="showCreateRequestModal()" tabindex="0">
                                <i class="fas"aria-hidden="true"></i> Nova Solicitação
                            </button>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <select aria-label="Seleção" class="form-select" id="filter-status" tabindex="0">
                                <option value="">Todos os Status</option>
                                <option value="pending">Pendente</option>
                                <option value="approved">Aprovado</option>
                                <option value="rejected">Rejeitado</option>
                                <option value="cancelled">Cancelado</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select aria-label="Seleção" class="form-select" id="filter-workflow" tabindex="0">
                                <option value="">Todos os Workflows</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-outline-secondary" onclick="filterRequests()" tabindex="0">
                                <i class="fas"aria-hidden="true"></i> Filtrar
                            </button>
                        </div>
                    </div>
                    <div id="requests-list">
                        <!-- Solicitações serão carregadas aqui -->
                    </div>
                </div>

                <!-- Pending Tab -->
                <div id="pending-tab" class="tab-content" class="extracted-style-2">
                    <h3>Minhas Aprovações Pendentes</h3>
                    <div id="pending-list">
                        <!-- Solicitações pendentes serão carregadas aqui -->
                    </div>
                </div>

                <!-- Analytics Tab -->
                <div id="analytics-tab" class="tab-content" class="extracted-style-3">
                    <h3>Analytics de Aprovações</h3>
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <select aria-label="Seleção" class="form-select" id="analytics-period" tabindex="0">
                                <option value="7">Últimos 7 dias</option>
                                <option value="30" selected>Últimos 30 dias</option>
                                <option value="90">Últimos 90 dias</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-primary" onclick="loadAnalytics()" tabindex="0">
                                <i class="fas"aria-hidden="true"></i> Carregar Analytics
                            </button>
                        </div>
                    </div>
                    <div id="analytics-content">
                        <!-- Analytics serão carregados aqui -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Create Workflow Modal -->
    <div class="modal fade" id="createWorkflowModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Criar Novo Workflow</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"aria-label="Fechar modal" tabindex="0"></button>
                </div>
                <div class="modal-body">
                    <form id="createWorkflowForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Nome do Workflow</label>
                                    <input id="workflow-name" aria-label="text input" type="text" class="form-control" id="workflow-name" required tabindex="0">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Tipo</label>
                                    <select aria-label="Seleção" class="form-select" id="workflow-type" required tabindex="0">
                                        <option value="expense">Aprovação de Despesas</option>
                                        <option value="contract">Aprovação de Contratos</option>
                                        <option value="purchase">Aprovação de Compras</option>
                                        <option value="general">Geral</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="workflow-description">Descrição</label>
                            <textarea class="form-control" id="workflow-description" rows="3" tabindex="0" aria-label="Descrição do workflow"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Passos de Aprovação</label>
                            <div id="workflow-steps">
                                <!-- Passos serão adicionados aqui -->
                            </div>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="addWorkflowStep()" tabindex="0">
                                <i class="fas" aria-hidden="true"></i> Adicionar Passo
                            </button>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" tabindex="0">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="createWorkflow()" tabindex="0">Criar Workflow</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Request Modal -->
    <div class="modal fade" id="createRequestModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nova Solicitação de Aprovação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar modal" tabindex="0"></button>
                </div>
                <div class="modal-body">
                    <form id="createRequestForm">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label class="form-label" for="request-title">Título</label>
                                    <input id="request-title" type="text" class="form-control" placeholder="Digite o título da solicitação" title="Título da solicitação" required tabindex="0" aria-label="Título da solicitação">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label" for="request-priority">Prioridade</label>
                                    <select class="form-select" id="request-priority" tabindex="0" aria-label="Seleção de prioridade">
                                        <option value="low">Baixa</option>
                                        <option value="medium" selected>Média</option>
                                        <option value="high">Alta</option>
                                        <option value="urgent">Urgente</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="request-workflow">Workflow</label>
                            <select class="form-select" id="request-workflow" required tabindex="0" aria-label="Seleção de workflow">
                                <option value="">Selecione um workflow</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="request-description">Descrição</label>
                            <textarea class="form-control" id="request-description" rows="3" tabindex="0" aria-label="Descrição da solicitação"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="request-data">Dados Adicionais (JSON)</label>
                            <textarea class="form-control" id="request-data" rows="4" placeholder='{
    "campo": "valor";
}' tabindex="0" aria-label="Dados adicionais em formato JSON"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="request-expires">Data de Expiração (opcional)</label>
                            <input id="request-expires" type="datetime-local" class="form-control" placeholder="Selecione a data de expiração" title="Data de expiração da solicitação" tabindex="0" aria-label="Data de expiração da solicitação">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" tabindex="0">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="createRequest()" tabindex="0">Criar Solicitação</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Details Modal -->
    <div class="modal fade" id="requestDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalhes da Solicitação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar modal" tabindex="0"></button>
                </div>
                <div class="modal-body">
                    <div id="request-details-content">
                        <!-- Detalhes serão carregados aqui -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" tabindex="0">Fechar</button>
                    <div id="approval-actions" class="extracted-style-4">
                        <button type="button" class="btn btn-success" onclick="approveRequest()" tabindex="0">
                            <i class="fas" aria-hidden="true"></i> Aprovar
                        </button>
                        <button type="button" class="btn btn-danger" onclick="rejectRequest()" tabindex="0">
                            <i class="fas" aria-hidden="true"></i> Rejeitar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let currentUser = null;
        let currentRequestId = null;

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
    
            loadCurrentUser();
    
            loadWorkflows();
    
            loadRequests();
    
            loadPendingRequests();
    
            loadAnalytics();
});

        // Funções de navegação
        function showTab(tabName) {
    
            // Esconder todas as tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
});
            document.querySelectorAll('.nav-link').forEach(link => {
    
                link.classList.remove('active');
});

            // Mostrar tab selecionada
            document.getElementById(tabName + '-tab').style.display = 'block';
            event.target.classList.add('active');
        }

        // Carregar usuário atual
        async function loadCurrentUser() {
    
            try {
                const token = localStorage.getItem('token');
    
                if (!token) {
                    window.location.href = 'login.html';
    
                    return;
}

                const response = await fetch('/api/users/me', {
    headers: {
                        'Authorization': `Bearer ${token;
}`
                    }
                });

                if (response.ok) {
    
                    const data = await response.json();
    
                    currentUser = data.data;
}
            } catch (error) {
    console.error('Erro ao carregar usuário:', error);
}
        }

        // Carregar workflows
        async function loadWorkflows() {
    const response = await fetch('/api/approvals/workflows', {
                    headers: {
                        'Authorization': `Bearer ${token;
}`
                    }
                });

                if (response.ok) {
    
                    const data = await response.json();
    
                    displayWorkflows(data.data);
    
                    populateWorkflowSelects(data.data);
}
            } catch (error) {
    console.error('Erro ao carregar workflows:', error);
}
        }

        // Exibir workflows
        function displayWorkflows(workflows) {
    
            const container = document.getElementById('workflows-list');
    
            container.innerHTML = '';
    

            workflows.forEach(workflow => {
                const card = document.createElement('div');
    
                card.className = 'col-md-6 col-lg-4 mb-3';
    
                card.innerHTML = `
                    <div class="card approval-card">
                        <div class="card-body">
                            <h5 class="card-title">${workflow.name;
}</h5>
                            <p class="card-text text-muted">${
    workflow.description || 'Sem descrição';
}</p>
                            <div class="mb-2">
                                <span class="badge bg-primary">${
    workflow.type;
}</span>
                                <span class="badge bg-secondary">${
    workflow._count.requests;
} solicitações</span>
                            </div>
                            <div class="mb-2">
                                <small class="text-muted">Passos: ${
    workflow.steps.length;
}</small>
                            </div>
                            <div class="d-flex justify-content-between">
                                <small class="text-muted">Criado: ${
    new Date(workflow.created_at).toLocaleDateString();
}</small>
                                <button class="btn btn-sm btn-outline-primary" onclick="viewWorkflowDetails('${
    workflow.id;
}')" tabindex="0">
                                    <i class="fas"aria-hidden="true"></i> Ver
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Popular selects de workflow
        function populateWorkflowSelects(workflows) {
    if (select) {
                    select.innerHTML = selectId === 'filter-workflow' ? '<option value="">Todos os Workflows</option>' : '<option value="">Selecione um workflow</option>';
});
                }
            });
        }

        // Carregar solicitações
        async function loadRequests() {
    const response = await fetch('/api/approvals/requests', {
                    headers: {
                        'Authorization': `Bearer ${token;
}`
                    }
                });

                if (response.ok) {
    
                    const data = await response.json();
    
                    displayRequests(data.data);
}
            } catch (error) {
    console.error('Erro ao carregar solicitações:', error);
}
        }

        // Exibir solicitações
        function displayRequests(requests) {
    
            const container = document.getElementById('requests-list');
    
            container.innerHTML = '';
    

            requests.forEach(request => {
                const card = document.createElement('div');
    
                card.className = 'col-md-6 col-lg-4 mb-3';
    
                card.innerHTML = `
                    <div class="card approval-card ${request.status;
}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="card-title mb-0">${
    request.title;
}</h6>
                                <span class="badge priority-badge priority-${
    request.priority;
}">${
    request.priority;
}</span>
                            </div>
                            <p class="card-text text-muted">${
    request.description || 'Sem descrição';
}</p>
                            <div class="mb-2">
                                <small class="text-muted">Workflow: ${
    request.workflow.name;
}</small>
                            </div>
                            <div class="mb-2">
                                <small class="text-muted">Solicitante: ${
    request.requester.name;
}</small>
                            </div>
                            <div class="mb-2">
                                <div class="d-flex align-items-center">
                                    <span class="badge bg-${
    getStatusColor(request.status);
}">${
    request.status;
}</span>
                                    <div class="ms-2">
                                        ${
    generateStepIndicators(request.current_step, request.total_steps);
}
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <small class="text-muted">Criado: ${
    new Date(request.created_at).toLocaleDateString();
}</small>
                                <button class="btn btn-sm btn-outline-primary" onclick="viewRequestDetails('${
    request.id;
}')" tabindex="0">
                                    <i class="fas"aria-hidden="true"></i> Ver
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Carregar solicitações pendentes
        async function loadPendingRequests() {
    const response = await fetch('/api/approvals/pending', {
                    headers: {
                        'Authorization': `Bearer ${token;
}`
                    }
                });

                if (response.ok) {
    
                    const data = await response.json();
    
                    displayPendingRequests(data.data);
}
            } catch (error) {
    console.error('Erro ao carregar solicitações pendentes:', error);
}
        }

        // Exibir solicitações pendentes
        function displayPendingRequests(requests) {
    
            const container = document.getElementById('pending-list');
    
            container.innerHTML = '';
    

            if (requests.length === 0) {
                container.innerHTML = '<div class="alert alert-info">Nenhuma solicitação pendente para aprovação.</div>';
    
                return;
}

            requests.forEach(request => {
    
                const card = document.createElement('div');
    
                card.className = 'card approval-card pending mb-3';
    
                card.innerHTML = `
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title mb-0">${request.title;
}</h5>
                            <span class="badge priority-badge priority-${
    request.priority;
}">${
    request.priority;
}</span>
                        </div>
                        <p class="card-text">${
    request.description || 'Sem descrição';
}</p>
                        <div class="row mb-2">
                            <div class="col-md-6">
                                <small class="text-muted">Workflow: ${
    request.workflow.name;
}</small>
                            </div>
                            <div class="col-md-6">
                                <small class="text-muted">Solicitante: ${
    request.requester.name;
}</small>
                            </div>
                        </div>
                        <div class="mb-2">
                            <div class="d-flex align-items-center">
                                <span class="badge bg-warning">Pendente</span>
                                <div class="ms-2">
                                    ${
    generateStepIndicators(request.current_step, request.total_steps);
}
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">Criado: ${
    new Date(request.created_at).toLocaleDateString();
}</small>
                            <div>
                                <button class="btn btn-success btn-sm" onclick="approveRequestFromList('${
    request.id;
}')" tabindex="0">
                                    <i class="fas"aria-hidden="true"></i> Aprovar
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="rejectRequestFromList('${
    request.id;
}')" tabindex="0">
                                    <i class="fas"aria-hidden="true"></i> Rejeitar
                                </button>
                                <button class="btn btn-outline-primary btn-sm" onclick="viewRequestDetails('${
    request.id;
}')" tabindex="0">
                                    <i class="fas"aria-hidden="true"></i> Ver
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Carregar analytics
        async function loadAnalytics() {
    
            try {
                const period = document.getElementById('analytics-period').value;
    
                const token = localStorage.getItem('token');
    
                const response = await fetch(`/api/approvals/analytics?period=${period;
}`, {
    headers: {
                        'Authorization': `Bearer ${token;
}`
                    }
                });

        // Funções auxiliares
        function getStatusColor(status) {
    switch (status) {
                case 'pending': return 'warning';
    case 'approved': return 'success';
    case 'rejected': return 'danger';
    case 'cancelled': return 'secondary';
    default: return 'secondary';
}
        }

        function generateStepIndicators(current, total) {
    
            let indicators = '';
    
            for (let i = 1;
     i <= total;
     i++) {
                let className = 'step-pending';
    
                if (i < current) {
                    className = 'step-completed';
} else if (i === current) {
    
                    className = 'step-current';
}
                indicators += `<span class="step-indicator ${
    className;
}">${
    i;
}</span>`;
            }
            return indicators;
        }
