<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM - Sistema de Gestão Doméstica</title>
    <link rel="icon" type="image/png" href="/Logo.png">
    <link rel="shortcut icon" type="image/png" href="/Logo.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #root {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .loading-container {
            text-align: center;
            color: white;
            padding: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        .loading-text {
            font-size: 18px;
            margin-top: 20px;
            font-weight: 500;
        }
        
        .loading-subtitle {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.8;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-container">
            <div class="logo">
                <img src="Logo.png" alt="DOM" style="width: 64px; height: 64px; border-radius: 12px;">
            </div>
            <div class="loading-spinner"></div>
            <div class="loading-text">Carregando DOM...</div>
            <div class="loading-subtitle">Verificando sua sessão</div>
        </div>
    </div>

    <script>
        // Configuração da API
        const API_BASE_URL = 'http://localhost:3001/api';
        
        // Função para verificar se há uma sessão ativa
        async function checkActiveSession() {
            const token = localStorage.getItem('dom_v2_token');
            const user = localStorage.getItem('dom_v2_user');
            const loginTime = localStorage.getItem('dom_v2_login_time');
            
            if (!token || !user || !loginTime) {
                console.log('🔐 Nenhuma sessão encontrada, redirecionando para login');
                redirectToLogin();
                return;
            }
            
            // Verificar se a sessão não expirou (24 horas)
            const loginDate = new Date(loginTime);
            const now = new Date();
            const hoursDiff = (now - loginDate) / (1000 * 60 * 60);
            
            if (hoursDiff > 24) {
                console.log('⏰ Sessão expirada, redirecionando para login');
                clearSessionData();
                redirectToLogin();
                return;
            }
            
            try {
                // Validar token com o servidor
                const response = await fetch(`${API_BASE_URL}/auth/validate`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    console.log('✅ Sessão válida, redirecionando para dashboard');
                    const userData = JSON.parse(user);
                    redirectBasedOnProfile(userData.profile);
                } else {
                    console.log('❌ Sessão inválida, redirecionando para login');
                    clearSessionData();
                    redirectToLogin();
                }
            } catch (error) {
                console.error('Erro ao validar sessão:', error);
                // Em caso de erro de conexão, tentar usar a sessão local
                const userData = JSON.parse(user);
                redirectBasedOnProfile(userData.profile);
            }
        }
        
        // Função para limpar dados de sessão
        function clearSessionData() {
            localStorage.removeItem('dom_v2_user');
            localStorage.removeItem('dom_v2_token');
            localStorage.removeItem('dom_v2_login_time');
        }
        
        // Função para redirecionar para login
        function redirectToLogin() {
            window.location.href = 'login-screen.html';
        }
        
        // Função para redirecionar baseado no perfil
        function redirectBasedOnProfile(userProfile) {
            const profileRoutes = {
                'EMPLOYER': 'dashboard-employer.html',
                'EMPLOYEE': 'dashboard-employee.html',
                'FAMILY': 'dashboard-family.html',
                'ADMIN': 'dashboard-admin.html'
            };
            
            const route = profileRoutes[userProfile] || 'profile-selector.html';
            window.location.href = route;
        }
        
        // Função para atualizar o texto de carregamento
        function updateLoadingText(text, subtitle = '') {
            const loadingText = document.querySelector('.loading-text');
            const loadingSubtitle = document.querySelector('.loading-subtitle');
            
            if (loadingText) loadingText.textContent = text;
            if (loadingSubtitle) loadingSubtitle.textContent = subtitle;
        }
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 DOM - Iniciando verificação de sessão');
            
            // Simular um pequeno delay para mostrar a tela de carregamento
            setTimeout(async () => {
                updateLoadingText('Verificando sua sessão...', 'Conectando ao servidor');
                
                try {
                    await checkActiveSession();
                } catch (error) {
                    console.error('Erro durante verificação de sessão:', error);
                    updateLoadingText('Erro de conexão', 'Redirecionando para login...');
                    setTimeout(() => {
                        redirectToLogin();
                    }, 2000);
                }
            }, 1000);
        });
    </script>
</body>
</html>
